<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Operatto - Checklist de Limpeza</title>
<style>
  :root { --azul:#202b3c; --azul2:#34445c; --ok:#1e8e3e; --nc:#c62828; --borda:#d6d9de; --fundo:#f4f6f9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, Helvetica, sans-serif; background:var(--fundo); color:#1b2430; }
  header { background:var(--azul); color:#fff; padding:14px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; margin-right:auto; }
  .tab { background:transparent; color:#fff; border:1px solid rgba(255,255,255,.4); padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:600; }
  .tab.ativa { background:#fff; color:var(--azul); }
  main { max-width:900px; margin:0 auto; padding:18px; }
  section { display:none; }
  section.ativa { display:block; }
  .card { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:16px; margin-bottom:16px; }
  .campos { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  label { font-size:12px; font-weight:700; color:#55606e; display:block; margin-bottom:4px; }
  input[type=text], input[type=date], input[type=month], select { width:100%; padding:10px; border:1px solid var(--borda); border-radius:8px; font-size:14px; background:#fff; }
  .btn { background:var(--azul); color:#fff; border:0; padding:12px 20px; border-radius:10px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; font-size:14px; }
  .btn:hover { background:var(--azul2); }
  .btn.verde { background:var(--ok); }
  .btn.verde:hover { background:#17712f; }
  .btn.cinza { background:#6b7684; }
  .btn.peq { padding:7px 12px; font-size:12px; border-radius:8px; }
  .btn.vermelho { background:var(--nc); }
  .barra { display:flex; gap:10px; flex-wrap:wrap; margin-top:14px; }
  .setor-titulo { font-weight:700; color:var(--azul); background:#e1e6ed; margin:-16px -16px 8px; padding:10px 16px; border-radius:12px 12px 0 0; }
  .item { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #eef0f3; }
  .item:last-child { border-bottom:0; }
  .item .nome { flex:1; font-size:14px; }
  .opt { min-width:52px; padding:8px 0; border:1px solid var(--borda); background:#fff; border-radius:8px; cursor:pointer; font-weight:700; font-size:13px; }
  .opt.C.sel { background:#e6f4ea; color:var(--ok); border-color:var(--ok); }
  .opt.NC.sel { background:#fdecea; color:var(--nc); border-color:var(--nc); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:16px; }
  .stat { background:#fff; border:1px solid var(--borda); border-radius:12px; padding:14px; }
  .stat b { display:block; font-size:22px; color:var(--azul); }
  .stat span { font-size:12px; color:#55606e; }
  table { border-collapse:collapse; width:100%; font-size:13px; }
  th, td { border:1px solid var(--borda); padding:7px 8px; text-align:left; }
  th { background:var(--azul); color:#fff; text-align:center; }
  .tabela-wrap { overflow-x:auto; }
  .vazio { color:#6b7684; padding:20px; text-align:center; }
  .acoes { display:flex; gap:6px; flex-wrap:wrap; }
  .status { font-size:12px; color:#55606e; margin-top:10px; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--azul); color:#fff; padding:12px 20px; border-radius:10px; opacity:0; pointer-events:none; transition:opacity .25s; z-index:50; }
  #toast.mostra { opacity:1; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:60; padding:16px; }
  #modal.aberto { display:flex; }
  #modal .caixa { background:#fff; border-radius:14px; padding:22px; max-width:380px; width:100%; text-align:center; }
  #modal h3 { margin:0 0 8px; color:var(--azul); }
  #modal p { margin:0 0 16px; color:#55606e; font-size:14px; }
  #modal .barra { justify-content:center; margin-top:0; }
</style>
</head>
<body>

<header>
  <h1>Operatto • Limpeza</h1>
  <button class="tab ativa" data-tab="checklist">Checklist</button>
  <button class="tab" data-tab="dashboard">Dashboard</button>
</header>

<main>
  <!-- ============ CHECKLIST (sem tabela) ============ -->
  <section id="checklist" class="ativa">
    <div class="card">
      <div class="campos">
        <div><label>Data do checklist</label><input type="date" id="fData"></div>
        <div><label>Chefe de cozinha</label><input type="text" id="fChefe"></div>
        <div><label>Gerente</label><input type="text" id="fGerente"></div>
      </div>
      <div class="barra">
        <button class="btn verde" onclick="salvarChecklist()"><span>💾</span> SALVAR CHECKLIST</button>
        <button class="btn" onclick="gerarPDFAtual()"><span>📄</span> GERAR PDF</button>
      </div>
      <div class="status" id="statusEdicao"></div>
    </div>

    <div id="listaChecklist"></div>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="dashboard">
    <div class="stats" id="stats"></div>

    <div class="card">
      <strong>Gerar PDF do período</strong>
      <div class="campos" style="margin-top:10px;">
        <div><label>Mês</label><input type="month" id="pMes"></div>
        <div><label>Quinzena</label>
          <select id="pQuinz">
            <option value="1">Dias 1 a 15</option>
            <option value="2">Dias 16 a 30</option>
          </select>
        </div>
      </div>
      <div class="barra">
        <button class="btn" onclick="gerarPDFDashboard()"><span>📄</span> GERAR PDF</button>
      </div>
      <p class="status">O PDF traz a tabela do período e, em seguida, a aferição anterior (quinzena anterior).</p>
    </div>

    <div class="card">
      <strong>Checklists salvos</strong>
      <div class="tabela-wrap" id="listaHistorico" style="margin-top:10px;"></div>
    </div>
  </section>
</main>

<!-- Pergunta exibida depois de salvar -->
<div id="modal">
  <div class="caixa">
    <h3>Checklist salvo!</h3>
    <p>Deseja gerar o PDF agora? Ele sairá com a aferição anterior.</p>
    <div class="barra">
      <button class="btn" onclick="fecharModal(true)"><span>📄</span> GERAR PDF</button>
      <button class="btn cinza" onclick="fecharModal(false)">Agora não</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- BIBLIOTECAS PDF -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.4/jspdf.plugin.autotable.min.js"></script>

<script>
/* =========================================================
   DADOS FIXOS DO CHECKLIST
   ========================================================= */
const SETORES = [
  { nome: "COZINHA", tarefas: ["Banho-maria 1","Banho-maria 2","Coifa (por fora)","Fogões","Chapa","Bancadas","Prateleiras","Bancada refrigerada","Pista fria","Micro-ondas","Utensílios","Fritadeiras","Processador","Lixeiras","Balança","Estoque seco","Piso do estoque"] },
  { nome: "SALÃO / CAIXA", tarefas: ["Mesas, estofados e cadeiras","Freezer, geladeira e adega por fora","Aparadores","Utensílios","Balcão caixa","Piso","Cardápios","Computadores","Portas de vidros","Estufa para quibes","Cafeteira","Chopeira","Micro-ondas"] },
  { nome: "COPA", tarefas: ["Geladeira e freezer (por fora)","Balcão refrigerado (por fora)","Máquina de gelo","Utensílios","Lixeiras","Bancadas","Liquidificadores e espremedores"] }
];
const ITENS = [];
SETORES.forEach(s => s.tarefas.forEach((t, i) => ITENS.push({ setor: s.nome, primeiro: i === 0, tarefa: t })));
const MESES = ["JANEIRO","FEVEREIRO","MARÇO","ABRIL","MAIO","JUNHO","JULHO","AGOSTO","SETEMBRO","OUTUBRO","NOVEMBRO","DEZEMBRO"];

/* =========================================================
   ARMAZENAMENTO (isolado para facilitar trocar por Supabase)
   Um registro por dia: { "2026-11-07": { data, chefe, gerente, resp[], salvoEm } }
   ========================================================= */
const CHAVE = "operatto_limpeza_dias_v3";
function lerDias() {
  try { return JSON.parse(localStorage.getItem(CHAVE)) || {}; }
  catch (e) { return {}; }
}
function gravarDias(obj) { localStorage.setItem(CHAVE, JSON.stringify(obj)); }

/* =========================================================
   UTIL
   ========================================================= */
function vazias() { return ITENS.map(() => ""); }
let respostas = vazias();
let idParaPDF = null; // data (YYYY-MM-DD) usada ao gerar o PDF depois de salvar

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("mostra");
  setTimeout(() => t.classList.remove("mostra"), 2200);
}
function hoje() { return new Date().toLocaleDateString("en-CA"); } // YYYY-MM-DD (data local)
function fmtDia(k) { const [a, m, d] = k.split("-"); return d + "/" + m + "/" + a; }
function pad(n) { return String(n).padStart(2, "0"); }

/* quinzena: 1 = dias 1..15 | 2 = dias 16..30 (15 colunas, como no modelo) */
function janela(ano, mes, quinz) {
  const ini = quinz === 1 ? 1 : 16;
  const dias = Array.from({ length: 15 }, (_, i) => ini + i);
  return {
    ano, mes, quinz, dias,
    keys: dias.map(d => ano + "-" + pad(mes) + "-" + pad(d))
  };
}
function janelaAnterior(j) {
  if (j.quinz === 2) return janela(j.ano, j.mes, 1);
  return j.mes === 1 ? janela(j.ano - 1, 12, 2) : janela(j.ano, j.mes - 1, 2);
}
function janelaDaData(k) {
  const [a, m, d] = k.split("-").map(Number);
  return janela(a, m, d <= 15 ? 1 : 2);
}

/* =========================================================
   CHECKLIST NA TELA (lista simples, sem tabela)
   ========================================================= */
function desenharChecklist() {
  const alvo = document.getElementById("listaChecklist");
  let html = "", idx = 0;
  SETORES.forEach(s => {
    html += `<div class="card"><div class="setor-titulo">${esc(s.nome)}</div>`;
    s.tarefas.forEach(t => {
      const i = idx++;
      const v = respostas[i];
      html += `<div class="item"><div class="nome">${esc(t)}</div>
        <button class="opt C ${v === "C" ? "sel" : ""}" onclick="marcar(${i},'C')">C</button>
        <button class="opt NC ${v === "NC" ? "sel" : ""}" onclick="marcar(${i},'NC')">NC</button></div>`;
    });
    html += "</div>";
  });
  alvo.innerHTML = html;

  const k = document.getElementById("fData").value;
  const rec = lerDias()[k];
  let msg = rec ? "Checklist de " + fmtDia(k) + " já salvo — salvar de novo atualiza este dia." : "Checklist de " + (k ? fmtDia(k) : "—") + " ainda não salvo.";
  if (k && Number(k.split("-")[2]) === 31) msg += " Atenção: o dia 31 não entra na tabela do PDF (15 colunas).";
  document.getElementById("statusEdicao").textContent = msg;
}
function marcar(i, valor) {
  respostas[i] = respostas[i] === valor ? "" : valor; // clicar de novo limpa
  desenharChecklist();
}
function carregarDia() {
  const k = document.getElementById("fData").value;
  const rec = lerDias()[k];
  if (rec) {
    respostas = rec.resp.slice();
    document.getElementById("fChefe").value = rec.chefe || "";
    document.getElementById("fGerente").value = rec.gerente || "";
  } else {
    respostas = vazias();
    // mantém chefe/gerente já digitados para agilizar o próximo dia
  }
  desenharChecklist();
}
document.getElementById("fData").addEventListener("change", carregarDia);

/* =========================================================
   SALVAR (e perguntar se quer gerar o PDF)
   ========================================================= */
function gravarAtual() {
  const k = document.getElementById("fData").value;
  if (!k) { toast("Escolha a data do checklist"); return null; }
  const dias = lerDias();
  dias[k] = {
    data: k,
    chefe: document.getElementById("fChefe").value.trim(),
    gerente: document.getElementById("fGerente").value.trim(),
    resp: respostas.slice(),
    salvoEm: Date.now()
  };
  gravarDias(dias);
  desenharChecklist();
  desenharDashboard();
  return k;
}
function salvarChecklist() {
  const k = gravarAtual();
  if (!k) return;
  idParaPDF = k;
  document.getElementById("modal").classList.add("aberto");
}
function fecharModal(gerar) {
  document.getElementById("modal").classList.remove("aberto");
  if (gerar && idParaPDF) gerarPDFDaData(idParaPDF);
  else toast("Checklist salvo!");
}
function abrirDia(k) {
  document.getElementById("fData").value = k;
  carregarDia();
  mostrarAba("checklist");
}
function excluirDia(k) {
  if (!confirm("Excluir o checklist de " + fmtDia(k) + "? Essa ação não pode ser desfeita.")) return;
  const dias = lerDias();
  delete dias[k];
  gravarDias(dias);
  carregarDia();
  desenharDashboard();
  toast("Checklist excluído");
}

/* =========================================================
   DASHBOARD
   ========================================================= */
function resumo(resp) {
  let c = 0, nc = 0;
  resp.forEach(v => { if (v === "C") c++; else if (v === "NC") nc++; });
  const total = c + nc;
  return { c, nc, total, pct: total ? Math.round((c / total) * 100) : 0 };
}
function desenharDashboard() {
  const dias = lerDias();
  const chaves = Object.keys(dias).sort().reverse();
  const stats = document.getElementById("stats");
  const alvo = document.getElementById("listaHistorico");

  if (!chaves.length) {
    stats.innerHTML = "";
    alvo.innerHTML = '<div class="vazio">Nenhum checklist salvo ainda. Preencha o checklist e clique em SALVAR.</div>';
    return;
  }
  const ult = resumo(dias[chaves[0]].resp);
  const ant = chaves[1] ? resumo(dias[chaves[1]].resp) : null;
  stats.innerHTML = `
    <div class="stat"><b>${chaves.length}</b><span>Dias salvos</span></div>
    <div class="stat"><b>${ult.pct}%</b><span>Conformidade do último dia${ant ? " (anterior: " + ant.pct + "%)" : ""}</span></div>
    <div class="stat"><b>${ult.nc}</b><span>Não conformidades no último dia</span></div>
    <div class="stat"><b>${fmtDia(chaves[0])}</b><span>Último checklist</span></div>`;

  alvo.innerHTML = `<table>
    <thead><tr><th>Data</th><th>Chefe de cozinha</th><th>Gerente</th><th>Conforme</th><th>NC</th><th>Ações</th></tr></thead>
    <tbody>${chaves.map(k => {
      const r = dias[k], s = resumo(r.resp);
      return `<tr>
        <td>${fmtDia(k)}</td>
        <td>${esc(r.chefe) || "—"}</td>
        <td>${esc(r.gerente) || "—"}</td>
        <td style="text-align:center">${s.pct}%</td>
        <td style="text-align:center">${s.nc}</td>
        <td><div class="acoes">
          <button class="btn peq" onclick="gerarPDFDaData('${k}')">📄 PDF</button>
          <button class="btn peq cinza" onclick="abrirDia('${k}')">Abrir</button>
          <button class="btn peq vermelho" onclick="excluirDia('${k}')">Excluir</button>
        </div></td>
      </tr>`;
    }).join("")}</tbody></table>`;

  // período padrão do gerador de PDF = quinzena do último checklist
  const j = janelaDaData(chaves[0]);
  const pm = document.getElementById("pMes");
  if (!pm.value) {
    pm.value = j.ano + "-" + pad(j.mes);
    document.getElementById("pQuinz").value = String(j.quinz);
  }
}

/* =========================================================
   PDF — modelo A3 paisagem, 15 dias, com aferição anterior
   ========================================================= */
function gerarPDFAtual() {
  // tudo que vira PDF também fica salvo
  const k = gravarAtual();
  if (k) gerarPDFDaData(k);
}
function gerarPDFDaData(k) {
  const j = janelaDaData(k);
  gerarPDFPeriodo(j.ano, j.mes, j.quinz);
}
function gerarPDFDashboard() {
  const v = document.getElementById("pMes").value;
  if (!v) { toast("Escolha o mês"); return; }
  const [a, m] = v.split("-").map(Number);
  gerarPDFPeriodo(a, m, Number(document.getElementById("pQuinz").value));
}

function celulaPDF(v) {
  if (v === "C") return "C (X) NC ( )";
  if (v === "NC") return "C ( ) NC (X)";
  return "C ( ) NC ( )";
}

function montarTabelaPDF(pdf, j, dados, startY) {
  const corpo = ITENS.map((it, i) => [
    it.primeiro ? it.setor : "",
    it.tarefa,
    ...j.keys.map(k => celulaPDF(dados[k] ? dados[k].resp[i] : ""))
  ]);

  pdf.autoTable({
    startY: startY,
    head: [["SETOR", "ATIVIDADE", ...j.dias.map(String)]],
    body: corpo,
    theme: "grid",
    margin: { left: 10, right: 10, bottom: 20 },
    styles: {
      font: "helvetica", fontSize: 6, cellPadding: 2, halign: "center", valign: "middle",
      lineColor: [170, 170, 170], lineWidth: 0.2, textColor: [35, 35, 35]
    },
    headStyles: { fillColor: [35, 45, 60], textColor: [255, 255, 255], fontStyle: "bold", fontSize: 7 },
    columnStyles: {
      0: { cellWidth: 25, fontStyle: "bold" },
      1: { cellWidth: 65, halign: "left", fontSize: 7 }
    },
    didParseCell: function (data) {
      if (data.section !== "body") return;
      if (data.column.index === 0 && data.cell.raw) {
        data.cell.styles.fillColor = [225, 230, 237];
        data.cell.styles.fontStyle = "bold";
      }
      if (data.column.index >= 2) {
        const raw = String(data.cell.raw);
        if (raw.indexOf("NC (X)") !== -1) {
          data.cell.styles.fillColor = [253, 236, 234];
          data.cell.styles.textColor = [198, 40, 40];
          data.cell.styles.fontStyle = "bold";
        } else if (raw.indexOf("C (X)") === 0) {
          data.cell.styles.fillColor = [230, 244, 234];
          data.cell.styles.textColor = [30, 142, 62];
          data.cell.styles.fontStyle = "bold";
        }
      }
    },
    didDrawPage: function () {
      pdf.setFontSize(8);
      pdf.setFont("helvetica", "normal");
      pdf.setTextColor(35);
      pdf.text("C = Conforme     |     NC = Não Conforme", 12, pdf.internal.pageSize.height - 12);
      pdf.text("Página " + pdf.internal.getCurrentPageInfo().pageNumber, pdf.internal.pageSize.width - 25, pdf.internal.pageSize.height - 12);
    }
  });
}

function responsaveis(j, dados) {
  // usa o chefe/gerente do último dia salvo dentro do período
  let chefe = "", gerente = "";
  j.keys.forEach(k => {
    if (dados[k]) {
      if (dados[k].chefe) chefe = dados[k].chefe;
      if (dados[k].gerente) gerente = dados[k].gerente;
    }
  });
  return { chefe, gerente };
}
function temRegistro(j, dados) { return j.keys.some(k => dados[k]); }

function cabecalhoPDF(pdf, titulo, j, dados) {
  const linha = "__________________________";
  const r = responsaveis(j, dados);
  pdf.setTextColor(35);
  pdf.setFont("helvetica", "bold");
  pdf.setFontSize(19);
  pdf.text(titulo, 210, 15, { align: "center" });

  pdf.setFontSize(10);
  pdf.setFont("helvetica", "normal");
  pdf.text("MÊS: " + MESES[j.mes - 1], 12, 26);
  pdf.text("CHEFE DE COZINHA: " + (r.chefe || linha), 105, 26);
  pdf.text("GERENTE: " + (r.gerente || linha), 270, 26);

  pdf.setFontSize(8);
  pdf.setTextColor(90);
  pdf.text("Período: dias " + j.dias[0] + " a " + j.dias[j.dias.length - 1] + " de " + MESES[j.mes - 1].toLowerCase() + " de " + j.ano, 12, 30);
  pdf.setTextColor(35);
  return r;
}

function gerarPDFPeriodo(ano, mes, quinz) {
  const dados = lerDias();
  const j = janela(ano, mes, quinz);
  const prev = janelaAnterior(j);
  const { jsPDF } = window.jspdf;

  const pdf = new jsPDF({ orientation: "landscape", unit: "mm", format: "a3" });

  /* ---------- AFERIÇÃO ATUAL ---------- */
  cabecalhoPDF(pdf, "CHECKLIST DE LIMPEZA", j, dados);
  montarTabelaPDF(pdf, j, dados, 34);

  let y = pdf.lastAutoTable.finalY + 15;
  if (y > pdf.internal.pageSize.height - 35) { pdf.addPage(); y = 25; }
  pdf.setFontSize(10);
  pdf.setFont("helvetica", "normal");
  pdf.setTextColor(35);
  pdf.text("ASSINATURA DO CHEFE DE COZINHA:", 15, y);
  pdf.line(75, y + 2, 165, y + 2);
  pdf.text("ASSINATURA DO GERENTE:", 220, y);
  pdf.line(270, y + 2, 390, y + 2);

  /* ---------- AFERIÇÃO ANTERIOR ---------- */
  if (temRegistro(prev, dados)) {
    pdf.addPage();
    cabecalhoPDF(pdf, "AFERIÇÃO ANTERIOR", prev, dados);
    montarTabelaPDF(pdf, prev, dados, 34);
  } else {
    pdf.setFontSize(9);
    pdf.setTextColor(90);
    pdf.text("Aferição anterior: sem registros salvos no período anterior (dias " + prev.dias[0] + " a " + prev.dias[prev.dias.length - 1] + " de " + MESES[prev.mes - 1].toLowerCase() + ").", 15, y + 16);
    pdf.setTextColor(35);
  }

  pdf.save("Checklist_de_Limpeza_" + MESES[mes - 1] + "_" + j.dias[0] + "-" + j.dias[j.dias.length - 1] + ".pdf");
}

/* =========================================================
   ABAS / INÍCIO
   ========================================================= */
function mostrarAba(nome) {
  document.querySelectorAll("section").forEach(s => s.classList.toggle("ativa", s.id === nome));
  document.querySelectorAll(".tab").forEach(b => b.classList.toggle("ativa", b.dataset.tab === nome));
  if (nome === "dashboard") desenharDashboard();
}
document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => mostrarAba(b.dataset.tab)));

document.getElementById("fData").value = hoje();
carregarDia();
desenharDashboard();
</script>
